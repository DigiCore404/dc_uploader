name: dc_uploader
services:
  uploader:
    image: ${IMAGE:-ghcr.io/digicore404/dc_uploader:edge}
    init: true
    user: "${PUID:?Run setup.sh}:${PGID:?Run setup.sh}"
    shm_size: 256m
    restart: unless-stopped
    environment:
      DIGITALCORE_CONFIG: /config/config.ini
      DIGITALCORE_WEB_PASSWORD: ${DIGITALCORE_WEB_PASSWORD:?Set a workspace access password}
    ports:
      - "${BIND_IP:-127.0.0.1}:${PORT:-6080}:6080"
    volumes:
      - type: bind
        source: ${MEDIA_DIR:?Run setup.sh with --media}
        target: /content
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${STATE_DIR:?Run setup.sh}/config
        target: /config
        bind: {create_host_path: false}
      - type: bind
        source: ${STATE_DIR}/data
        target: /app/data
        bind: {create_host_path: false}
      - type: bind
        source: ${STATE_DIR}/tmp
        target: /app/tmp
        bind: {create_host_path: false}
      - type: bind
        source: ${STATE_DIR}/logs
        target: /app/logs
        bind: {create_host_path: false}
      - type: bind
        source: ${STATE_DIR}/watch
        target: /watch
        bind: {create_host_path: false}
      - type: bind
        source: ${STATE_DIR}/mounts
        target: /mounts
        bind: {create_host_path: false}
