; DigitalCore Uploader - native Linux/seedbox setup. Docker is not required.
; Edit API_KEY and ANNOUNCEURL, then run: bash start.sh check
; No quotes around paths. Relative paths start at the extracted app directory.
[Website]
SITEURL = https://digitalcore.club
API_KEY =

[Torrent]
HASHER = mkbrr
; Empty uses mkbrr on PATH or the bundled Linux executable.
MKBRR_BIN =
ANNOUNCEURL =

[Paths]
; A library with one release subfolder per upload. Files stay in place.
; Change to your real seedbox media folder, e.g. /home/your-user/media
DATADIR = content
; Output .torrent files only, not downloaded media. Configure qBittorrent to
; watch this same directory and save to the correct parent of each release.
WATCHFOLDER = watch
TMP_DIR = tmp
UPLOADLOG = logs/upload.log

[Settings]
IMAGE_UPLOAD = true
SCREENSHOTS = true
MEDIAINFO = true
DUPECHECK = true

[Web]
; Initial credentials only. Later login/IP changes live in private SQLite.
USERNAME = admin
; Set a strong initial password before first startup, or leave blank to print
; a generated initial login in the terminal. Keep that login after restarting.
PASSWORD =
; Loopback access through the SSH tunnel; change in Settings if needed.
ALLOWED_IPS = 127.0.0.1/32, ::1/128

[Watch]
; For existing qBittorrent downloads prefer its completion command instead:
; /bin/bash /path/to/uploader/start.sh completed "%F" --cat 6 --hash "%I"
; Requires a release directory inside DATADIR; see README for Docker limitations.
; CLI watcher is OFF until explicitly started: bash start.sh watch --cat 6
; Only fully prepared release folders belong in content/incoming.
; A filename pause does not prove that a torrent download is complete.
INCOMING_DIR = incoming
INTERVAL_SECONDS = 30
STABLE_SECONDS = 120

[Imports]
; For scheduled torrent imports: add/test your client in the browser Clients
; page, then save/test the mapping in Settings. On the same native seedbox,
; REMOTE_ROOT and LOCAL_ROOT normally refer to the same real media directory.
; Blank roots are chosen in the UI. The API alone does not transfer media.
CLIENT_ID =
REMOTE_ROOT =
LOCAL_ROOT =

[TMDB]
; Optional metadata search token.
TOKEN =

[ImageHost]
; digitalcore uses the Website API key; imghost needs its own API_KEY below.
PROVIDER = digitalcore
API_KEY =

[MediaTools]
; MTN binary is bundled for Linux x86_64; use PATH or MTNBIN on other hosts.
SCREENSHOT_ENGINE = ffmpeg
screenshot_sheet = true
SCREENSHOT_SINGLES = 5
MTNBIN =
MTNWIDTH = 1280
MTNSETTING = -c 2 -r 8 -D 8

