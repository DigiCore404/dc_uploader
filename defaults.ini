[Header]
version = 3.0.0
text = Uploader for digitalcore.club
date = 2026-10-16

[Website]
api_key =
siteurl = https://digitalcore.club

[UploadForm]
freeleech = 0
anonymous = 0

[ImageHost]
; Empty auto-detects the existing host. Options: digitalcore, imghost, custom.
PROVIDER = digitalcore
API_KEY =
uploadimgurl =
authcode =
; Mark uploads as adult only when appropriate for the selected release.
NSFW = false

[Torrent]
hasher = mkbrr
mkbrr_bin =
edit_torrent = false
sourcefolder =
ecomment = Created for digitalcore.club
esource = DigitalCore
creator = Created by DigitalCore Uploader
announceurl =

[Paths]
template_path = files/template.txt
tmp_dir = tmp
watchfolder = watch
datadir = content
filters = files/filters.json
uploadlog = files/upload.log

[Settings]
image_upload = true
dupecheck = true
dupedl = false
addfastresume = false
watchfolder_fallback_plain = true
watchfolder_fallback_uploaded_torrent = false
prependname = dc.
screenshot_sample_fallback = true
screenshots = true
screenshot_categories = 2, 1, 5, 6, 4, 3, 38, 7, 8, 9, 10, 11, 12, 13, 14, 15, 24, 42, 30, 31, 32, 34, 35, 36, 37, 41
mediainfo = true
mediainfo_categories = 2, 1, 5, 6, 4, 3, 38, 7, 8, 9, 10, 11, 12, 13, 14, 15, 24, 42, 30, 31, 32, 34, 35, 36, 37, 41
cleanup = true
require_screenshots = true
include_nfo = true

[MediaTools]
SCREENSHOT_ENGINE = mtn
MTNBIN =
MTNWIDTH = 1280
MTNSETTING = -c 2 -r 8 -D 8
MTNPOSTBY = DigitalCore
MTNFONTFILE =
screenshot_sheet = true
screenshot_singles = 5

[Network]
timeout = 60
torrentdownloadretries = 12
torrentdownloadretrydelay = 5
useragent = Mozilla/5.0 (Windows NT 10.0; Win64; x64) dc_uploader/1.0
verify_ssl = true

[UnrarUpload]
enabled = false
mode = unpacked_only
title_suffix =
title_separator =
rar2fs_bin = rar2fs
mount_options = -o allow_other --seek-length=1
mount_base = content
categories =
ratio_target = 2.5
registry = data/unrar_mounts.json
log = files/unrar_upload.log
cleanup_log = files/unrar_cleanup.log
cleanup_after_qbit_remove = true
cleanup_grace_seconds = 300
keep_failed_mounts = false
regenerate_mediainfo = true
mount_ready_timeout = 15


[TMDB]
; Optional metadata lookup. Token stays on this server.
TOKEN =

